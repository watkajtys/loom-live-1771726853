<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AuraSpace Floating Widgets Variant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff6b6b",
                        "secondary": "#ffa502",
                        "accent": "#ff9f43",
                        "background-light": "#fff0f0",
                        "background-dark": "#2d1b2e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "3rem",
                        "full": "9999px"
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 7s ease-in-out infinite 1s',
                        'float-slow': 'float 8s ease-in-out infinite 2s',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                },
            },
        }
    </script>
<style>input[type=range][orient=vertical] {
            writing-mode: bt-lr;-webkit-appearance: slider-vertical;width: 8px;
            height: 100%;
            padding: 0 5px;
        }.glass-widget {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 24px 0 rgba(31, 38, 135, 0.1);
        }.custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-[#2d1b2e] text-white font-display min-h-screen relative overflow-hidden flex flex-col justify-center items-center">
<div class="absolute inset-0 z-0 bg-gradient-to-br from-[#ff9a9e] via-[#fad0c4] to-[#fbc2eb]">
<div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] rounded-full bg-[#ffecd2] opacity-60 blur-[100px] animate-pulse-slow"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-[#fcb69f] opacity-60 blur-[80px] animate-pulse-slow" style="animation-delay: 2s;"></div>
<div class="absolute top-[30%] right-[10%] w-[40%] h-[40%] rounded-full bg-[#ff9a9e] opacity-40 blur-[90px] animate-float"></div>
<div class="absolute bottom-[20%] left-[10%] w-[35%] h-[35%] rounded-full bg-[#a18cd1] opacity-30 blur-[70px] animate-float-delayed"></div>
</div>
<div class="relative z-10 w-full max-w-[1400px] h-[90vh] p-4 flex gap-8 justify-center items-center">
<div class="hidden lg:flex flex-col justify-center items-end gap-12 w-1/5 h-full relative">
<div class="glass-bubble w-32 h-32 rounded-full flex flex-col items-center justify-center animate-float relative group cursor-pointer hover:bg-white/30 transition-all">
<span class="material-symbols-outlined text-orange-500 text-3xl mb-1">local_fire_department</span>
<span class="text-3xl font-bold text-white drop-shadow-md">12</span>
<span class="text-xs font-medium text-white/80 uppercase tracking-wide">Streak</span>
<div class="absolute -right-2 top-0 w-3 h-3 bg-red-400 rounded-full border border-white animate-ping"></div>
</div>
<div class="glass-bubble w-40 h-40 rounded-full flex flex-col items-center justify-center animate-float-delayed relative ml-8 group cursor-pointer hover:bg-white/30 transition-all">
<span class="material-symbols-outlined text-purple-600 text-3xl mb-1">target</span>
<div class="text-center">
<span class="text-2xl font-bold text-white drop-shadow-md">4.5</span>
<span class="text-xs text-white/70 block">/ 6 hrs</span>
</div>
<div class="w-16 h-1.5 bg-white/20 rounded-full mt-2 overflow-hidden">
<div class="h-full w-[75%] bg-purple-500 rounded-full shadow-[0_0_10px_rgba(168,85,247,0.6)]"></div>
</div>
</div>
</div>
<div class="flex flex-col items-center justify-center gap-8 w-full max-w-lg lg:w-2/5 relative">
<div class="glass-widget w-80 h-80 rounded-full flex flex-col items-center justify-center relative animate-float shadow-[0_20px_50px_rgba(0,0,0,0.1)]">
<svg class="absolute inset-0 w-full h-full -rotate-90 p-4" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(255,255,255,0.1)" stroke-width="3"></circle>
<circle class="drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]" cx="50" cy="50" fill="none" r="45" stroke="white" stroke-dasharray="283" stroke-dashoffset="70" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<div class="flex flex-col items-center z-10">
<div class="flex items-center gap-2 mb-2 px-3 py-1 rounded-full bg-white/20 backdrop-blur-sm">
<span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span>
<span class="text-xs font-semibold text-white uppercase tracking-widest">Focus</span>
</div>
<div class="text-7xl font-light text-white tracking-tighter drop-shadow-lg mb-2">25:00</div>
<div class="flex items-center gap-4 mt-4">
<button class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center text-white transition-all">
<span class="material-symbols-outlined text-xl">restart_alt</span>
</button>
<button class="w-16 h-16 rounded-full bg-white text-primary shadow-lg hover:scale-110 active:scale-95 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-3xl fill-1">play_arrow</span>
</button>
<button class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center text-white transition-all">
<span class="material-symbols-outlined text-xl">skip_next</span>
</button>
</div>
</div>
</div>
<div class="glass-widget w-full h-32 rounded-[2rem] px-8 py-4 flex items-center justify-between animate-float-delayed relative">
<div class="absolute -top-3 left-8 px-3 py-0.5 bg-white/30 backdrop-blur-md rounded-full border border-white/20">
<span class="text-[10px] font-bold uppercase tracking-wider text-white">Ambience</span>
</div>
<div class="flex flex-col items-center gap-2 h-full justify-center group">
<div class="relative w-8 h-16 bg-white/10 rounded-full flex justify-center overflow-hidden">
<div class="absolute bottom-0 w-full bg-blue-400/50 h-[40%] group-hover:bg-blue-400/70 transition-all"></div>
<input class="absolute w-full h-full opacity-0 cursor-pointer z-10" orient="vertical" type="range"/>
</div>
<span class="material-symbols-outlined text-white/80 text-lg">rainy</span>
</div>
<div class="flex flex-col items-center gap-2 h-full justify-center group">
<div class="relative w-8 h-16 bg-white/10 rounded-full flex justify-center overflow-hidden">
<div class="absolute bottom-0 w-full bg-orange-400/50 h-[60%] group-hover:bg-orange-400/70 transition-all"></div>
<input class="absolute w-full h-full opacity-0 cursor-pointer z-10" orient="vertical" type="range"/>
</div>
<span class="material-symbols-outlined text-white/80 text-lg">storefront</span>
</div>
<div class="flex flex-col items-center gap-2 h-full justify-center group">
<div class="relative w-8 h-16 bg-white/10 rounded-full flex justify-center overflow-hidden">
<div class="absolute bottom-0 w-full bg-pink-400/50 h-[25%] group-hover:bg-pink-400/70 transition-all"></div>
<input class="absolute w-full h-full opacity-0 cursor-pointer z-10" orient="vertical" type="range"/>
</div>
<span class="material-symbols-outlined text-white/80 text-lg">waves</span>
</div>
<div class="flex flex-col items-center gap-2 h-full justify-center group">
<div class="relative w-8 h-16 bg-white/10 rounded-full flex justify-center overflow-hidden">
<div class="absolute bottom-0 w-full bg-green-400/50 h-[80%] group-hover:bg-green-400/70 transition-all"></div>
<input class="absolute w-full h-full opacity-0 cursor-pointer z-10" orient="vertical" type="range"/>
</div>
<span class="material-symbols-outlined text-white/80 text-lg">forest</span>
</div>
</div>
</div>
<div class="hidden lg:flex flex-col justify-center items-start w-1/4 h-[80%]">
<div class="glass-widget w-full h-full rounded-[3rem] p-6 flex flex-col relative animate-float-slow">
<div class="flex items-center justify-between mb-6 px-2">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white">
<span class="material-symbols-outlined">check</span>
</div>
<h2 class="text-xl font-semibold text-white">Tasks</h2>
</div>
<button class="w-8 h-8 rounded-full bg-white text-primary flex items-center justify-center hover:scale-110 transition-transform shadow-lg">
<span class="material-symbols-outlined font-bold">add</span>
</button>
</div>
<div class="flex-1 overflow-y-auto custom-scrollbar space-y-3 px-1">
<div class="group flex items-center gap-3 p-3 bg-white/10 hover:bg-white/20 rounded-2xl transition-all cursor-pointer border border-transparent hover:border-white/20">
<div class="w-5 h-5 rounded-full border-2 border-white/40 group-hover:border-white group-hover:bg-white/20 transition-all"></div>
<span class="text-sm text-white/90 font-medium flex-1">Morning Standup Notes</span>
</div>
<div class="group flex items-center gap-3 p-3 bg-white/25 rounded-2xl shadow-lg border border-white/40">
<div class="w-5 h-5 rounded-full border-2 border-white bg-white flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-primary"></div>
</div>

<span class="material-symbols-outlined text-white/60 text-sm">drag_indicator</span>
</div>
<div class="group flex items-center gap-3 p-3 bg-white/5 hover:bg-white/20 rounded-2xl transition-all cursor-pointer border border-transparent hover:border-white/20">
<div class="w-5 h-5 rounded-full border-2 border-white/40 group-hover:border-white transition-all"></div>
<span class="text-sm text-white/80 flex-1">Review Design System</span>
</div>
<div class="group flex items-center gap-3 p-3 bg-white/5 hover:bg-white/20 rounded-2xl transition-all cursor-pointer border border-transparent hover:border-white/20">
<div class="w-5 h-5 rounded-full border-2 border-white/40 group-hover:border-white transition-all"></div>
<span class="text-sm text-white/80 flex-1">Email Catch-up</span>
</div>
<div class="group flex items-center gap-3 p-3 bg-white/5 hover:bg-white/20 rounded-2xl transition-all cursor-pointer border border-transparent hover:border-white/20">
<div class="w-5 h-5 rounded-full border-2 border-white/40 group-hover:border-white transition-all"></div>
<span class="text-sm text-white/80 flex-1">Update Kanban</span>
</div>
<div class="group flex items-center gap-3 p-3 bg-white/5 hover:bg-white/20 rounded-2xl transition-all cursor-pointer border border-transparent hover:border-white/20">
<div class="w-5 h-5 rounded-full border-2 border-white/40 group-hover:border-white transition-all"></div>
<span class="text-sm text-white/80 flex-1">Lunch Order</span>
</div>
</div>
</div>
</div>
</div>
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 glass-widget px-6 py-3 rounded-full flex items-center gap-6 z-50 animate-float-delayed">

<div class="w-10 h-10 rounded-full bg-white text-primary flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">dashboard</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 group opacity-70 hover:opacity-100 transition-opacity" href="#">
<div class="w-10 h-10 rounded-full hover:bg-white/20 flex items-center justify-center text-white transition-colors">
<span class="material-symbols-outlined">bar_chart</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 group opacity-70 hover:opacity-100 transition-opacity" href="#">
<div class="w-10 h-10 rounded-full hover:bg-white/20 flex items-center justify-center text-white transition-colors">
<span class="material-symbols-outlined">settings</span>
</div>
</a>
<div class="w-px h-8 bg-white/20 mx-2"></div>
<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-400 to-pink-400 border-2 border-white flex items-center justify-center text-xs font-bold shadow-md cursor-pointer">
            JD
         </div>
</nav>

</body></html>
